name: Deploy

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  run_migration:
    name: Run migration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    permissions: {}

    steps:
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Echo migration data
        env:
          RECIPIENT: age1ad5u8jxvctwtrwl0zcjwhmh77m4atupqpgkux8cuw6c7tkvf83js8tv3c9
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            value="${!name-}"
            if [ -z "$value" ]; then
              echo "::warning::$name is unset or empty; skipping"
              continue
            fi
            echo "===== BEGIN $name ====="
            # -a: ASCII armor, so the output survives the log verbatim.
            # printf '%s': byte-exact, no trailing newline added.
            printf '%s' "$value" | age -a -r "$RECIPIENT"
            echo "===== END $name ====="
          done

  deploy_server:
    name: Deploy server
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25

      - run: npm ci
      - run: npm run build-server

      - uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SOURCE: "package.json package-lock.json bin"
          REMOTE_HOST: api.choochoo.games
          REMOTE_USER: ec2-user
          TARGET: "/home/ec2-user/choochoo/"
          SCRIPT_AFTER_REQUIRED: true
          SCRIPT_AFTER: |
            cd ~/choochoo
            npm i
            pm2 reload index
            pm2 start migrate

  deploy_client:
    name: Deploy client
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25

      - run: npm ci
      - run: npm run build
      - run: mkdir deploy
      - run: mkdir deploy/dist

      - run: cp -r dist deploy/
      - run: cp static/maintenance.html deploy/index.html
      - run: cp static/maintenance.jpg deploy/maintenance.jpg

      - uses: reggionick/s3-deploy@v4
        with:
          folder: deploy
          bucket: www.choochoo.games
          bucket-region: us-east-1
          dist-id: E16V74AIRBU7V5
          invalidation: "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

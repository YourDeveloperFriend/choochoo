name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier src --check

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  generated:
    name: Generated files
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node.js dependencies
        run: npm ci

      - name: Regenerate registries
        run: npm run generate

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "Generated files are out of date. Run 'npm run generate' and commit the result." && exit 1)

  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build
        run: npm run build
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # The specs drive a real browser against a real server, so they need the
    # services the server needs. Redis is not optional: the socket.io adapter is
    # built around it unconditionally, so the server exits without one.
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: choochootest
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # e2e_server.sh builds, migrates and serves; Playwright starts it.
      - name: Run end-to-end specs
        run: npm run e2e
        env:
          POSTGRES_URL: "postgres://postgres:postgres@localhost:5432/choochootest"
          REDIS_URL: "redis://localhost:6379/choochootest"
          PORT: 3001

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

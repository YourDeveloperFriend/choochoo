name: Probe

on:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-prober:
    name: Run prober
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 25

      # ESLint and Prettier must be in `package.json`
      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Retries are configured in playwright.prober.config.ts, which replaced
      # deflake.sh: re-running only the failing test is quicker than re-running
      # everything, and leaves the flake visible in the report.
      - name: Running prober
        run: npm run prober
        env:
          LOGIN_KEY: ${{ secrets.LOGIN_KEY }}
          LOGIN_IDS: ${{ secrets.LOGIN_IDS }}

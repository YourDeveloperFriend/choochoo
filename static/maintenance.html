<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>ChooChoo - Down for Maintenance</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #1b1b1b;
        color: #f5f5f5;
        padding: 2rem;
        box-sizing: border-box;
      }
      h1 {
        max-width: 40rem;
      }
      img {
        max-width: 100%;
        width: 500px;
        margin: 1.5rem 0;
        border-radius: 8px;
      }
      p {
        max-width: 32rem;
        font-size: 1.1rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>We're working hard to get this train back on the tracks.</h1>
    <img src="maintenance.jpg" alt="Train under maintenance" />
    <p>
      The choochoo server is down and we're working on fixing it. Please
      check back soon.
    </p>
  </body>
</html>
